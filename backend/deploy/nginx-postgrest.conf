# =============================================================================
# Façade LOCALE de PostgREST — ce que le backend appelle à la place de Supabase.
#
# Installée par backend/deploy/install_db.sh :
#   /etc/nginx/sites-available/uti-postgrest → sites-enabled/
#
# POURQUOI CE FICHIER EXISTE
# supabase-py construit lui-même ses URL : rest_url = f"{SUPABASE_URL}/rest/v1"
# (supabase/_sync/client.py:73). PostgREST, lui, sert les tables à la racine
# (/profiles, /consultants…) et n'a aucune option de préfixe. Ce bloc est le
# traducteur entre les deux — c'est la seule raison de sa présence.
#
# POURQUOI IL N'ÉCOUTE QUE SUR 127.0.0.1
# Exposer PostgREST sur Internet reviendrait à mettre la base entière derrière un
# unique porteur de jeton. Rien ne l'exige : le frontend Vercel ne parle jamais à
# la base (aucune dépendance @supabase/* dans frontend/package.json), seul le
# backend FastAPI, sur CETTE machine, interroge la base. La surface publique reste
# donc l'API FastAPI et elle seule — strictement moins exposé que Supabase, où
# /rest/v1 est joignable depuis n'importe où.
#
# Ce fichier est SÉPARÉ de backend/nginx.conf à dessein : certbot réécrit le
# fichier du site public à chaque renouvellement (DEPLOYMENT_OVH.md:112-114) et
# ne doit jamais toucher à ce bloc.
# =============================================================================
server {
    # PAS de « listen 8080 » tout court : sans adresse, nginx écouterait sur
    # toutes les interfaces, y compris l'IP publique du VPS.
    listen 127.0.0.1:8080;
    server_name _;

    access_log /var/log/nginx/uti-postgrest.access.log;
    error_log  /var/log/nginx/uti-postgrest.error.log warn;

    # Aucun téléversement ne passe par ici : les CV vont vers OVH Object Storage.
    # Les corps de requête sont des INSERT/UPDATE JSON.
    client_max_body_size 5M;

    location /rest/v1/ {
        # LA BARRE OBLIQUE FINALE EST TOUT LE SUJET. Avec elle, nginx REMPLACE
        # le préfixe « /rest/v1/ » par « / » : /rest/v1/consultants?select=* est
        # servi comme /consultants?select=* côté PostgREST. Sans elle, PostgREST
        # recevrait /rest/v1/consultants et chercherait une table « rest ».
        proxy_pass http://127.0.0.1:3000/;

        # Connexions persistantes vers PostgREST (économise un handshake TCP par
        # requête ; le backend en fait plusieurs par appel d'API).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # nginx retransmet déjà les en-têtes du client. Ces lignes ne changent
        # rien au comportement : elles inscrivent noir sur blanc le contrat dont
        # dépend supabase-py, pour qu'une modification future ne le casse pas
        # par inadvertance.
        #   Authorization   : le jeton service_role — sans lui, PostgREST répond 401.
        #   Prefer          : « return=representation » (update() doit renvoyer les
        #                     lignes touchées, base de l anti double-envoi), et
        #                     « count=exact » pour .execute(count="exact").
        #   Range/Range-Unit: pagination .range() et .limit().
        #   Accept-Profile  : schéma visé, posé par postgrest-py sur CHAQUE requête
        #                     (postgrest/base_client.py:26).
        proxy_set_header Authorization   $http_authorization;
        proxy_set_header Prefer          $http_prefer;
        proxy_set_header Range           $http_range;
        proxy_set_header Range-Unit      $http_range_unit;
        proxy_set_header Accept-Profile  $http_accept_profile;
        proxy_set_header Content-Profile $http_content_profile;

        # PostgREST répond ses erreurs en JSON, et le backend LIT ce JSON (code
        # PGRST116 pour .single(), 23505 pour un conflit d unicité…). Si nginx
        # substituait ses propres pages d erreur, supabase-py recevrait du HTML
        # et lèverait « JSON could not be generated » à la place de l erreur
        # réelle — un diagnostic faux à chaque incident.
        proxy_intercept_errors off;

        # Doit rester SUPÉRIEUR au statement_timeout de 30 s posé sur le rôle
        # authenticator : on veut que ce soit PostgreSQL qui coupe (et rende un
        # JSON exploitable), jamais nginx (qui rendrait un 504 en HTML).
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Pas de gzip : tout ce trafic est de la boucle locale. Compresser
        # coûterait du CPU sur un VPS modeste sans économiser un seul octet.
        gzip off;
    }

    # Repère explicite pour le chantier « authentification maison ». Sans lui,
    # basculer SUPABASE_URL vers cette façade avant que l auth locale n existe
    # renverrait un 404 nginx que routers/auth.py:495-500 traduirait en
    # « Email ou mot de passe incorrect » — un message faux, et une heure perdue.
    location /auth/v1/ {
        default_type application/json;
        return 501 '{"code":"UTI-AUTH-ABSENTE","message":"GoTrue ne repond plus sur cette URL. Le remplacement maison de l authentification doit etre deploye avant de basculer SUPABASE_URL."}';
    }

    # Tout le reste est fermé : cette façade n existe que pour /rest/v1/.
    location / {
        return 404;
    }
}
