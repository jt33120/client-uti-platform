name: CI

# Filet de sécurité : la suite pytest (scoring, hybride, anti-biais, extraction AO)
# et le build front tournent sur chaque PR et sur master. Jusqu'ici les tests
# existaient mais ne s'exécutaient nulle part automatiquement — un merge pouvait
# casser le scoring sans que rien ne l'attrape.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Dimanche 06:00 UTC — le pendant, côté dépôt, de la revue hebdomadaire qui
  # tourne sur le VPS (RUNBOOK §12). Une CI qui ne se déclenche que sur commit
  # ne dit rien d'une semaine sans commit : or `pip install -r requirements.txt`
  # résout des versions à CHAQUE exécution, et une dépendance publiée entre-temps
  # peut casser l'installation d'un dépôt que personne n'a touché. On l'apprend
  # alors le jour d'un correctif urgent, au pire moment.
  schedule:
    - cron: "0 6 * * 0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run tests
        working-directory: backend
        # `config.Settings` exige supabase_url / service_key et construit un client
        # à l'import : on fournit des valeurs factices (aucun appel réseau à la
        # construction). Les tests sont de la logique pure (aucune I/O réelle).
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          # supabase-py valide le FORMAT de la clé (JWT à 3 segments) à la
          # construction du client : une chaîne quelconque lève « Invalid API key ».
          # Faux JWT syntaxiquement valide (aucun appel réseau) — suffit à l'import.
          SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.c2lnbmF0dXJlLXBsYWNlaG9sZGVy
        run: pytest -q

  scripts:
    name: Scripts · syntaxe
    # Six scripts bash portent la sauvegarde, la restauration, la supervision et
    # la bascule — c'est-à-dire tout ce qui doit encore marcher le jour où le
    # reste ne marche plus. Rien ne les vérifiait : une accolade oubliée ne se
    # serait vue qu'au déclenchement du minuteur, et un script qui ne démarre
    # pas ne crie pas — il ne fait rien, et son silence ressemble à une semaine
    # sans incident.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse syntaxique
        run: |
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::syntaxe bash invalide"; exit 1; }
            echo "ok  $f"
          done
      - name: shellcheck (indicatif)
        # Non bloquant DÉLIBÉRÉMENT : ces scripts n'ont jamais été passés à
        # shellcheck, et rendre la CI rouge sur un héritage qu'on n'a pas encore
        # lu apprendrait surtout à ignorer le rouge. Le pas suivant est de
        # traiter ce qu'il remonte, puis de retirer cette ligne.
        continue-on-error: true
        run: shellcheck --severity=error $(git ls-files '*.sh')

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
