# Nginx reverse proxy for the UTI Platform backend.
# Install on the VPS:
#   sudo cp /home/julian.talou/app/backend/nginx.conf /etc/nginx/sites-available/plateforme
#   sudo ln -sf /etc/nginx/sites-available/plateforme /etc/nginx/sites-enabled/plateforme
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then enable HTTPS (certbot rewrites this file to add the 443 block + redirect):
#   sudo certbot --nginx -d vps-cc93f2a8.vps.ovh.net
server {
    listen 80;
    server_name vps-cc93f2a8.vps.ovh.net;

    # CV PDFs / avatars are uploaded through the API — raise the default 1 MB limit.
    client_max_body_size 25M;

    # Compresse les réponses JSON de l'API (les gros payloads : listes de
    # matchings, annuaire consultants). Le frontend statique est sur Vercel,
    # donc seul le trafic API transite ici.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_proxied any;

    # ── Fichiers servis par le backend (STORAGE_BACKEND=local) ──────────────
    # PAS de X-Accel-Redirect, et c'est une décision, pas un oubli.
    #
    # X-Accel-Redirect ferait autoriser par FastAPI et servir par nginx. À 38
    # objets et ~50 Mo, il n'y a rien à y gagner : un PDF de 2 Mo occupe un
    # worker quelques millisecondes sur la boucle locale. Et il coûte deux
    # choses réelles :
    #   1. nginx (www-data) devrait POUVOIR LIRE le répertoire des fichiers.
    #      Aujourd'hui il est en 0700 julian.talou : un seul lecteur. Ajouter
    #      www-data pour des CV, des attestations URSSAF et des KBIS, afin de
    #      gagner une performance dont on n'a pas besoin, est un mauvais échange.
    #   2. la décision « qui a le droit de lire » vivrait à DEUX endroits — le
    #      backend qui autorise, nginx qui sert. C'est exactement le montage qui
    #      avait laissé les CV en public-read (tests/test_storage_acl.py:4-11) :
    #      deux définitions cohérentes chacune avec elle-même, et divergentes.
    #
    # SEUIL DE BASCULE, écrit pour ne pas être décidé à l'instinct : passer à
    # X-Accel-Redirect le jour où un objet unique dépasse ~100 Mo, ou si les
    # téléchargements concurrents saturent l'unique worker uvicorn
    # (uti-backend.service impose --workers 1).
    location /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sans cela, nginx met en tampon la réponse entière avant de la
        # transmettre : un CV de 10 Mo passe par un fichier temporaire disque
        # avant d'atteindre le navigateur, pour aucun gain.
        proxy_buffering off;

        # La compression est INUTILE ici (PDF, PNG, JPEG sont déjà compressés)
        # et coûterait du CPU sur chaque téléchargement.
        gzip off;

        # ── LE JETON NE DOIT PAS ATTERRIR DANS LES JOURNAUX ──────────────
        # Ici, le jeton EST l'autorisation : il n'y a pas d'en-tête
        # Authorization, la preuve d'accès tient entièrement dans l'URL. Or
        # `access_log` journalise l'URI complet dans $request.
        #
        # Conséquence sans cette ligne : quiconque lit /var/log/nginx/access.log
        # — tout compte du groupe `adm`, toute copie de journaux envoyée à un
        # support, toute archive de configuration — récupère des jetons
        # utilisables DEPUIS N'IMPORTE OÙ SUR INTERNET, sans aucun compte. Et
        # pas pour une minute : le lien de CV transmis au client final vaut
        # SEPT JOURS (services/cv_notifications.py).
        #
        # C'est aussi ce qui rendait cohérente la séparation des clés de
        # signature : services/storage.py invoque « les journaux nginx » comme
        # motif de ne pas réutiliser le secret de session. Invoquer le risque
        # sans fermer le canal ne protégeait de rien.
        #
        # On coupe donc le journal d'accès sur ce chemin. La trace applicative
        # de qui télécharge quoi appartient de toute façon au backend, qui
        # connaît l'utilisateur — pas à nginx, qui ne voit qu'une URL opaque.
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI matching can take a while — give upstream generous timeouts.
        # Aligné avec le TimeoutStopSec du service systemd (90s) + marge.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
