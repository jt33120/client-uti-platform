    <script src="https://mip-rum-console.vercel.app/mip-rum.js"></script>
    <script>
      MIPRum.init({

        clientId: "groupement-it",
        apiKey: "mip_live_gip_59ca708ce596d20a52d58ea976dc512c516b442a",
